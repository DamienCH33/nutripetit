name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest
        name: Tests

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: nutripetit
                    POSTGRES_PASSWORD: nutripetit
                    POSTGRES_DB: nutripetit
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: "postgresql://nutripetit:nutripetit@127.0.0.1:5432/nutripetit?serverVersion=16&charset=utf8"
            REDIS_URL: "redis://127.0.0.1:6379/15"

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, redis
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Create test database & run migrations
              run: |
                  php bin/console --env=test doctrine:database:create --if-not-exists
                  php bin/console --env=test doctrine:migrations:migrate -n

            - name: Run tests
              run: composer test
