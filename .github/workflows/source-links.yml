name: Source Links

on:
    schedule:
        - cron: "0 6 * * 1,3,5"

    workflow_dispatch:

jobs:
    links:
        name: Source Links
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup PHP 8.4
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, xml, ctype, iconv, intl
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: Check scoring source links
              run: php bin/console app:check-source-links
