framework:
    cache:
        pools:
            nutripetit.off_api:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%'
                default_lifetime: 604800

            # Compteurs du rate limiter : partagés entre instances,
            # survivent aux déploiements (les fenêtres durent 1 min, TTL court).
            nutripetit.rate_limiter:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%'
                default_lifetime: 3600

when@test:
    framework:
        cache:
            app: cache.adapter.array

when@prod:
    framework:
        cache:
            pools:
                nutripetit.off_api:
                    adapter: cache.adapter.redis
                    provider: '%env(REDIS_URL)%'
                    default_lifetime: 604800

                nutripetit.rate_limiter:
                    adapter: cache.adapter.redis
                    provider: '%env(REDIS_URL)%'
                    default_lifetime: 3600
